<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/chalo-app-public/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="chalo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>chalo</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API — see maps_config.example.js for how the key
    is provisioned (gitignored maps_config.js, never committed).

    maps_config.js is loaded first (404s harmlessly if it hasn't been
    created locally — window.GOOGLE_MAPS_WEB_API_KEY just stays undefined).
    The real Maps script is only injected if a real key has been filled in,
    so google_maps_flutter_web's map widgets render without tiles instead
    of the page trying (and failing) to load Maps with an empty/placeholder
    key. See docs/technical/architecture/current-implementation.md.
  -->
  <script src="maps_config.js"></script>
  <script>
    (function () {
      var key = window.GOOGLE_MAPS_WEB_API_KEY;
      if (key && key !== 'YOUR_WEB_MAPS_KEY_HERE') {
        var mapsScript = document.createElement('script');
        mapsScript.src = 'https://maps.googleapis.com/maps/api/js?key=' + key;
        document.head.appendChild(mapsScript);
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
